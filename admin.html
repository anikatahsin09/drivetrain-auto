<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Login - Drivetrain Auto</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->

            <img
                src="drivetrainlogo.jpeg"
                alt="Drivetrain Auto Logo"
                class="login-logo"
            >


            <!-- Title -->

            <h1>
                Owner Login
            </h1>


            <p>
                Drivetrain Auto Admin Panel
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter owner email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Login Message -->

            <p id="loginMessage"></p>


            <!-- Back Button -->

            <a href="index.html">
                ← Back to Website
            </a>

        </div>

    </div>


    <!-- JavaScript -->

   <script type="module" src="script.js"></script>

</body>

</html>
